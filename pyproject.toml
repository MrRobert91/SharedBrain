[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sharedbrain"
version = "0.1.0"
description = "Capa de contexto personal para agentes de IA: convierte un vault de Obsidian en contexto accionable."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastmcp>=2.0",
    "pydantic>=2.7",
    "pydantic-ai-slim[anthropic,openai]>=1.0.0",
    "typer>=0.12",
    "python-frontmatter>=1.1",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
sharedbrain = "sharedbrain.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/sharedbrain"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
