services:
  sharedbrain:
    build: .
    ports:
      - "8765:8765"
    volumes:
      # tu vault de Obsidian (lectura/escritura: la zona _ai/ vive dentro)
      - ${VAULT_PATH:?Define VAULT_PATH en .env apuntando a tu vault}:/vault
      # config + sqlite persistentes
      - ./data:/data
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      # con SHAREDBRAIN_VAULT no hace falta archivo de config
      - SHAREDBRAIN_VAULT=/vault
      - SHAREDBRAIN_VAULT_REPO=${SHAREDBRAIN_VAULT_REPO:-}
      - SHAREDBRAIN_VAULT_BRANCH=${SHAREDBRAIN_VAULT_BRANCH:-}
      - SHAREDBRAIN_MODEL=${SHAREDBRAIN_MODEL:-anthropic:claude-fable-5}
      - SHAREDBRAIN_MODEL_CHEAP=${SHAREDBRAIN_MODEL_CHEAP:-}
      - SHAREDBRAIN_PASSWORD=${SHAREDBRAIN_PASSWORD:-}
    restart: unless-stopped
